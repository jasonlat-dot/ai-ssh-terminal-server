#file: noinspection SpringBootApplicationYaml
server:
  port: 8888

# 应用配置 app.config.api-version
app:
  config:
    # 默认密钥（生产环境务必通过环境变量 SSH_DEFAULT_SECRET_KEY 覆盖）
    ssh-default-secret-key: ${SSH_DEFAULT_SECRET_KEY:R2F0Q1pYaUd2bFhUcU5VdE5ZbHdUc3NqQlJIRlR0Zz0}

openai:
  ai-api:
    base-url: ${AI_MODEL_BASE_URL:http://127.0.0.1:8777/}
    api-key: ${AI_MODEL_API_KEY:sk-waliapi-96cbfe096bdc4c08afa7667e9f8838b9}
    completions-path: ${AI_MODEL_COMPLETIONS_PATH:v1/chat/completions}
    embeddings-path: ${AI_MODEL_EMBEDDINGS_PATH:v1/embeddings}
    proxy:
      enabled: ${AI_MODEL_PROXY_ENABLED:true}
      host: ${AI_MODEL_PROXY_HOST:127.0.0.1}
      port: ${AI_MODEL_PROXY_PORT:7890}
      non-proxy-hosts:
        - ${AI_MODEL_NON_PROXY_HOST_1:localhost}
        - ${AI_MODEL_NON_PROXY_HOST_2:127.0.0.1}
        - ${AI_MODEL_NON_PROXY_HOST_3:192.168.*}
  chat-model:
    model-name: ${AI_MODEL_NAME:gpt-5.5}
    reasoning-effort: ${AI_MODEL_REASONING_EFFORT:medium}
    supported-media-types:
      - image/png
      - image/jpeg
      - image/webp
      - application/pdf

# agent 配置
ai:
  file:
    storage:
      default-id: ${FILE_STORAGE_DEFAULT_ID:local-main}
      local:
        # 后端随桌面客户端安装时可启用本地存储，并把 FILE_STORAGE_DEFAULT_ID 设为 local-main。
        enabled: ${LOCAL_FILE_STORAGE_ENABLED:true}
        storage-id: local-main
        # 默认写入当前用户目录，避免安装目录位于 Program Files 时没有写权限。
        root-directory: ${LOCAL_FILE_STORAGE_ROOT:${user.home}/.ai-ssh-terminal/files}
        # 可选固定下载地址；默认根据上传请求动态获取协议、主机、端口和部署前缀。
        # 只有反向代理未正确传递外部地址时才需要设置 LOCAL_FILE_STORAGE_PUBLIC_BASE_URL。
        public-base-url: ${LOCAL_FILE_STORAGE_PUBLIC_BASE_URL:}
        # 可留空并由进程随机生成；固定配置后，后端重启不会令尚未过期的链接提前失效。
        signing-secret: ${LOCAL_FILE_STORAGE_SIGNING_SECRET:}
      minio:
        # 默认不启用。未启用时上传接口返回 FILE_STORAGE_NOT_CONFIGURED，应用仍可启动。
        enabled: ${MINIO_ENABLED:true}
        storage-id: minio-main
        endpoint: ${MINIO_ENDPOINT:http://192.168.3.16:9002}
        # 浏览器可访问的对象API地址；为空时使用endpoint。不能填写MinIO控制台地址。
        public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
        access-key: ${MINIO_ACCESS_KEY:5YIBK708WNMSLKW99K04}
        secret-key: ${MINIO_SECRET_KEY:s1G4W4TromDgNNdSb+mnKAIxA1Zx7AqTbgMTRD+0}
        # 预先创建私有桶，应用不会自动建桶或修改桶策略。
        bucket: ${MINIO_BUCKET:ai-attachments}
        region: ${MINIO_REGION:us-east-1}
        connect-timeout: 5s
        read-timeout: 30s
        write-timeout: 60s
        call-timeout: 2m
  ssh:
    http-proxy:
      enabled: ${SSH_HTTP_PROXY_ENABLED:false}
      host: ${SSH_HTTP_PROXY_HOST:127.0.0.1}
      port: ${SSH_HTTP_PROXY_PORT:7890}
      username: ${SSH_HTTP_PROXY_USERNAME:}
      password: ${SSH_HTTP_PROXY_PASSWORD:}
