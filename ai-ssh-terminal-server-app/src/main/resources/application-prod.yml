#file: noinspection SpringBootApplicationYaml
#file: noinspection SpringBootApplicationYaml
server:
  port: 8888
  tomcat:
    threads:
      max: 200        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度

# 应用配置 app.config.api-version
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # 默认密钥（生产环境务必通过环境变量 SSH_DEFAULT_SECRET_KEY 覆盖）
    ssh-default-secret-key: ${SSH_DEFAULT_SECRET_KEY:R1F0Q1pYSUd2bFhxcU5DdE5ZbHdUc3NqQlJIRlRcZz0}

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  config:
    # 配置自定义的 agent yml配置文件
    import:
      #      - classpath:agent/test-agent.yml
      #      - classpath:agent/only-agent.yml
      - classpath:agent/ssh-agent.yml
      #      - classpath:agent/parallel_research_app.yml
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.168.3.16:13306/ssh_terminal?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1

# mybatis plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mybatis/mapper/*.xml


  # 日志
logging:
  level:
    root: info
    com.jasonlat.ai.infrastructure.dao: OFF # OFF: 禁止打印数据库日志, DEBUG：打印 SQL 和参数， TRACE：打印 SQL、参数和结果集
  config: classpath:logback-spring.xml


# agent 配置
ai:
  ssh:
    ## SSH Agent 命令安全策略。内置拒绝规则始终生效；这里只能追加业务规则。
    command-safety:
      max-command-length: 8192
      additional-deny-rules: []
  agent:
    context:
      # 上下文裁剪
      reducer:
        minimum-recent-messages: 5
        long-assistant-threshold: 4096
        error-keywords:
          - error
          - failed
          - exception
          - permission denied
          - operation not permitted
        important-path-suffixes:
          - .conf
          - .yml
          - .yaml
          - .properties
      # 里程碑
      milestone:
        enabled: true
        recent-limit: 10
        max-content-length: 1024
        rules:
          - id: user-task-change
            role: user
            type: TASK_CHANGE
            priority: 100
            pattern: "不对|不是这样|改一下|换个思路|换种方式|错了"

          - id: user-task-complete
            role: user
            type: TASK_COMPLETE
            priority: 90
            pattern: "完成了|搞定|结束|好了"

          - id: user-correction
            role: user
            type: USER_CORRECTION
            priority: 80
            pattern: "不要|停止|别"

          - id: tool-error
            role: tool
            type: ERROR
            priority: 100
            case-insensitive: true
            pattern: "error|failed|exception|permission denied|not found|refused"