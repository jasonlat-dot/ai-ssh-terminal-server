#file: noinspection SpringBootApplicationYaml
#file: noinspection SpringBootApplicationYaml
server:
  port: 8888
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:21MB}
      # 上传正文优先落临时磁盘，避免大量并发请求占满堆内存。
      file-size-threshold: 0B
      # 延迟到Controller参数绑定时解析，使文件接口的异常处理器能返回统一JSON。
      resolve-lazily: true
  tomcat:
    threads:
      max: 200        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度

# 应用配置 app.config.api-version
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # 默认密钥（生产环境务必通过环境变量 SSH_DEFAULT_SECRET_KEY 覆盖）
    ssh-default-secret-key: ${SSH_DEFAULT_SECRET_KEY:R2m0Q1pYeUd2bFhNaU5VdE5ZbHdUc3NqQlJIRlR0Zz1}

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  config:
    # 配置自定义的 agent yml配置文件
    import:
      #      - classpath:agent/test-agent.yml
      #      - classpath:agent/only-agent.yml
      - classpath:agent/ssh-agent.yml
      #      - classpath:agent/parallel_research_app.yml
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.168.3.16:13306/ssh_terminal?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1

# mybatis plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mybatis/mapper/*.xml


  # 日志
logging:
  level:
    root: info
    com.jasonlat.ai.infrastructure.dao: OFF # OFF: 禁止打印数据库日志, DEBUG：打印 SQL 和参数， TRACE：打印 SQL、参数和结果集
  config: classpath:logback-spring.xml

baidu:
  api-key: your-key

# agent 配置
ai:
  chat:
    attachments:
      max-files: ${CHAT_ATTACHMENT_MAX_FILES:4}
      max-total-size: ${CHAT_ATTACHMENT_MAX_TOTAL_SIZE:20MB}
      max-text-chars: ${CHAT_ATTACHMENT_MAX_TEXT_CHARS:60000}
      # 覆盖附件读取到模型调用结束的整个过程，控制媒体字节在内存中的并发驻留。
      max-concurrent-requests: ${CHAT_ATTACHMENT_MAX_CONCURRENT_REQUESTS:2}
      # 兼容当前无统一登录的上传链路；启用认证后建议关闭，并使用 Principal 记录归属。
      allow-anonymous-files: ${CHAT_ATTACHMENT_ALLOW_ANONYMOUS_FILES:true}
  file:
    upload:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-concurrent-uploads: ${FILE_MAX_CONCURRENT_UPLOADS:4}
      download-url-ttl: ${FILE_DOWNLOAD_URL_TTL:15m}
      # 本阶段只做格式准入与存储，不做文档解析、病毒扫描或聊天绑定。
      allowed-extensions: [ png, jpg, jpeg, webp, pdf, txt, log, csv, json, yaml, yml, md, docx, xlsx ]
    storage:
      default-id: ${FILE_STORAGE_DEFAULT_ID:minio-main}
      minio:
        # 默认不启用。未启用时上传接口返回 FILE_STORAGE_NOT_CONFIGURED，应用仍可启动。
        enabled: ${MINIO_ENABLED:true}
        storage-id: minio-main
        endpoint: ${MINIO_ENDPOINT:http://192.168.3.16:9002}
        # 浏览器可访问的对象API地址；为空时使用endpoint。不能填写MinIO控制台地址。
        public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
        access-key: ${MINIO_ACCESS_KEY:MINIO_ACCESS_KEY}
        secret-key: ${MINIO_SECRET_KEY:MINIO_SECRET_KEY}
        # 预先创建私有桶，应用不会自动建桶或修改桶策略。
        bucket: ${MINIO_BUCKET:ai-attachments}
        region: ${MINIO_REGION:us-east-1}
        connect-timeout: 5s
        read-timeout: 30s
        write-timeout: 60s
        call-timeout: 2m
  ssh:
    ssh:
      sftp:
        max-total-sessions: 50
        max-sessions-per-user: 5
        max-concurrent-transfers: 20
        max-concurrent-transfers-per-user: 4
        max-concurrent-transfers-per-session: 2
        max-tasks-per-session: 20
        # 限制全部任务清单占用的内存，不只限制正在传输的文件数。
        max-tracked-items: 100000
        max-files-per-task: 10000
        max-directory-depth: 64
        max-file-size: 10GB
        max-task-size: 100GB
        session-idle-timeout: 15m
        transfer-idle-timeout: 2m
        operation-timeout: 30s
        completed-task-retention: 30m
        cleanup-interval: 10s
        progress-publish-interval: 300ms
        # 仅用于项目当前的本地单用户模式。需与连接配置的 userId 一致。
        # 生产设为空字符串并接入 Principal；接口不接受客户端自报 userId。
        anonymous-user-id: ${SFTP_ANONYMOUS_USER_ID:default}
    command:
      # 连续没有命令输出时快速判定卡死；持续输出不会触发该限制。
      idle-timeout-seconds: ${SSH_COMMAND_IDLE_TIMEOUT_SECONDS:10}
      # 即使命令持续输出也不能超过该绝对上限。
      max-execution-timeout-seconds: ${SSH_COMMAND_MAX_EXECUTION_TIMEOUT_SECONDS:600}
    http-proxy:
      enabled: ${SSH_HTTP_PROXY_ENABLED:true}
      host: ${SSH_HTTP_PROXY_HOST:127.0.0.1}
      port: ${SSH_HTTP_PROXY_PORT:7890}
      username: ${SSH_HTTP_PROXY_USERNAME:}
      password: ${SSH_HTTP_PROXY_PASSWORD:}
    # 终端连接配置
    terminal:
      max-total-sessions: 500 # 整个应用允许同时存在的终端数。
      max-sessions-per-user: 50 # 单个用户允许同时存在的终端数。
      max-sessions-per-connection: 8 # 单个 SSH connectionId 允许同时存在的终端数。
      idle-timeout-minutes: 30 # 没有前端读写后，终端最多保留的分钟数。
      cleanup-interval-minutes: 10 # 后台清理任务的执行间隔（分钟）
      termination-record-ttl-minutes: 5 # 已结束终端的断开原因保留时间（分钟）
      max-termination-records: 1024 # 最多保留多少条终端结束原因，避免短时间大量重连占满内存。
    ## SSH Agent 命令安全策略。内置拒绝规则始终生效；这里只能追加业务规则。
    command-safety:
      max-command-length: 8192
      additional-deny-rules: []
