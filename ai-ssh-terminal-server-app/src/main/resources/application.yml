#file: noinspection SpringBootApplicationYaml
server:
  port: 8889
  tomcat:
    threads:
      max: 200        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度
    max-http-post-size: -1

# 应用配置 app.config.api-version
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # 默认密钥（生产环境务必通过环境变量 SSH_DEFAULT_SECRET_KEY 覆盖）
    ssh-default-secret-key: ${SSH_DEFAULT_SECRET_KEY:R2F0Q1pYaUd2bFhUcU5VdE5ZbHdUc3NqQlJIRlR0Zz0}
    # 桌面版后端的统一数据根目录；修改为绝对路径后，重启客户端即可整体切换。
    # application*.yml、SQLite、上传文件和日志都放在这个目录下。
    data-directory: ${AI_SSH_TERMINAL_HOME:${user.home}/.ai-ssh-terminal}
  database:
    # 桌面客户端默认使用本机 SQLite；设置 DATABASE_TYPE=mysql 可切回外部 MySQL。
    type: ${DATABASE_TYPE:sqlite}
    sqlite:
      # 默认值与 DatabaseProperties 中的 Java 默认路径保持一致。
      file: ${SQLITE_DATABASE_FILE:${app.config.data-directory}/data/ai-ssh-terminal.db}
      driver-class-name: org.sqlite.JDBC
      pool-name: AiSshTerminal-SQLite
      # SQLite 是单文件数据库，单写连接可避免不必要的 database is locked 冲突。
      maximum-pool-size: ${SQLITE_MAXIMUM_POOL_SIZE:1}
      busy-timeout: ${SQLITE_BUSY_TIMEOUT:10000}
    mysql:
      # MySQL 配置只保留在 prod 中；设置 DATABASE_TYPE=mysql 后才会创建该数据源。
      url: ${MYSQL_DATABASE_URL:jdbc:mysql://192.168.3.16:3306/ssh_terminal?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true}
      username: ${MYSQL_DATABASE_USERNAME:root}
      password: ${MYSQL_DATABASE_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: Retail_HikariCP
      minimum-idle: ${MYSQL_MINIMUM_IDLE:15}
      maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE:25}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${MYSQL_IDLE_TIMEOUT:180000}
      max-lifetime: ${MYSQL_MAX_LIFETIME:1800000}

# Jev/Laya System One 快速结构化决策配置。
ai:
  decision:
    # 是否调用 System One。
    # 当前默认开启；没有配置可用服务时可设置为 false，完全回退原有流程。
    enabled: ${AI_DECISION_ENABLED:true}

    # 影子模式下会调用并记录结果，但不会接管意图分类。
    # 当前 false 表示正式使用；如需先观察准确率可设置为 true。
    shadow-mode: ${AI_DECISION_SHADOW_MODE:false}

    # 统一的 System One 地址。 https://api.typesafe.ai/v1/systemone
    # 填 Jev 托管地址就调用 Jev，填本地/私有地址就调用 Laya。
    url: ${AI_DECISION_URL:http://127.0.0.1:8100/v1/systemone}

    # 可选 Bearer API Key。Jev 需要配置；未启用鉴权的 Laya 可以留空。
    # 真实密钥只通过环境变量或外部配置注入，不能提交到 Git。
    api-key: ${AI_DECISION_API_KEY:}

    # Jev 通常填写 jev-latest，Laya 可填写 multilingual。
    # 留空时请求中不发送 model，由服务端自动选择。
    model: ${AI_DECISION_MODEL:multilingual}

    # HTTP 建连和完整请求超时。本地 CPU 运行 Laya 时可适当调大。
    timeout: ${AI_DECISION_TIMEOUT:10s}

    # 意图识别使用 probabilities[choice] 判断是否接受结果。
    min-answer-probability: ${AI_DECISION_MIN_ANSWER_PROBABILITY:0.72}

    # 工具结果与当前意图偏差判断。
    # 该能力复用上面的统一 URL、密钥、模型和超时配置。
    tool-outcome:
      # 是否调用 Jev/Laya 执行结构化偏差判断。
      enabled: ${AI_DECISION_TOOL_OUTCOME_ENABLED:true}
      # true 时只记录结果，不改变反馈回路；false 时正式使用 Jev/Laya 的判断。
      shadow-mode: ${AI_DECISION_TOOL_OUTCOME_SHADOW_MODE:false}
      # 使用 probabilities[choice] 判断是否接受工具结果结论。
      min-answer-probability: ${AI_DECISION_TOOL_OUTCOME_MIN_ANSWER_PROBABILITY:0.78}
      # 最多发送给 Jev/Laya 的工具输出字符数，避免超长终端输出膨胀请求。
      max-result-characters: ${AI_DECISION_TOOL_OUTCOME_MAX_RESULT_CHARACTERS:4000}

spring:
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:21MB}
      # 上传正文优先落临时磁盘，避免大量并发请求占满堆内存。
      file-size-threshold: 0B
      # 延迟到Controller参数绑定时解析，使文件接口的异常处理器能返回统一JSON。
      resolve-lazily: true
  profiles:
    active: prod
  config:
    name: ${rootArtifactId}-app
    # 配置自定义的 agent yml配置文件
    import:
      - classpath:agent/ssh-agent.yml

# mybatis plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mybatis/mapper/*.xml


# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy



  # 日志
logging:
  # 默认与统一数据目录一致；可通过启动参数 -Dlogging.path=... 覆盖。
  # 桌面版启动器会自动注入 -Dlogging.path=<dataDirectory>/logs，
  # 让日志跟随用户在设置页配置的"统一数据目录"。
  path: ${app.config.data-directory}/logs
  level:
    root: info
    com.jasonlat.ai.infrastructure.dao: OFF # OFF: 禁止打印数据库日志, DEBUG：打印 SQL 和参数， TRACE：打印 SQL、参数和结果集
  config: classpath:logback-spring.xml
